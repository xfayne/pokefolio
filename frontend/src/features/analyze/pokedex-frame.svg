<path d="M426 48Q409 25 382 25H285Q279 25 275 30L240 63Q234 69 226 69H177Q169 69 163 75L139 96H61Q27 96 24 126" fill="none" stroke="#8a000b" stroke-width="7" stroke-linejoin="round"/>
<path d="M426 45Q409 22 382 22H285Q279 22 275 27L240 60Q234 66 226 66H177Q169 66 163 72L139 93H61Q27 93 24 123" fill="none" stroke="#ff666b" stroke-opacity=".85" stroke-width="2"/>
<path d="M277 3V20Q277 26 284 26" fill="none" stroke="#84000a" stroke-width="4"/>
<path d="M280 5V19" stroke="#ffabb0" stroke-width="2"/>
<path d="M47 8H267" stroke="#ffc5c5" stroke-opacity=".6" stroke-width="3" stroke-linecap="round" filter="url(#blur)"/>
