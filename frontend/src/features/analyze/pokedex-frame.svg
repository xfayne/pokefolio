<rect x="22" y="88" width="388" height="580" rx="39" fill="#9c0010" stroke="#ff4d57" stroke-width="2"/>
<rect x="27" y="94" width="378" height="566" rx="34" fill="#4a0007"/>
<rect x="31" y="98" width="370" height="557" rx="31" fill="#201e26" stroke="#f3636a" stroke-opacity=".7" stroke-width="2"/>
<rect x="36" y="104" width="360" height="545" rx="27" fill="url(#screen)" stroke="#090e1c" stroke-width="2"/>
<path d="M62 108H371Q390 108 391 130" fill="none" stroke="#f5fdff" stroke-opacity=".65" stroke-width="2"/>
<!-- Thick left articulated spine -->
<g stroke="#8e000b" stroke-width="2">
 <rect x="3" y="122" width="19" height="29" rx="4" fill="url(#top)"/>
 <rect x="3" y="152" width="19" height="25" rx="4" fill="url(#top)"/>
 <rect x="3" y="178" width="19" height="27" rx="4" fill="url(#top)"/>
</g>
<path d="M8 209V619Q8 649 23 661" fill="none" stroke="#ff7375" stroke-opacity=".6" stroke-width="3"/>
<path d="M416 108V629" fill="none" stroke="#ff6b70" stroke-opacity=".5" stroke-width="2"/>
<!-- Lens ring -->
<g filter="url(#shadow)">
 <circle cx="79" cy="48" r="43" fill="#ae0011" stroke="#ff606b" stroke-width="2"/>
 <circle cx="79" cy="48" r="38" fill="url(#metal)" stroke="#4d4048" stroke-width="2"/>
 <circle cx="79" cy="48" r="31.5" fill="#163d5a" stroke="#f9ffff" stroke-width="2"/>
 <circle cx="79" cy="48" r="28" fill="url(#lens)" stroke="#003a88" stroke-width="1.5"/>
 <circle class="pokedex-white-flash" cx="79" cy="48" r="28" fill="url(#lens-flash)" opacity="0"/>
 <ellipse cx="70" cy="34" rx="8" ry="10" fill="#ebffff" transform="rotate(28 70 34)"/>
 <path d="M59 56Q64 75 84 72" fill="none" stroke="#31e9ff" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
 <path d="M58 23Q80 6 102 28" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2"/>
</g>
<!-- Indicator lamps -->
<g stroke="#84000b" stroke-width="2.5"><circle cx="157" cy="36" r="10" fill="#382510"/><circle cx="184" cy="36" r="10" fill="#382510"/><circle cx="157" cy="36" r="9" fill="url(#green)"/><circle cx="184" cy="36" r="9" fill="url(#yellow)"/></g>
<!-- Speaker slots -->
<g stroke-linecap="round">
 <path d="M348 43L333 65M363 43L348 65M378 43L363 65" stroke="#ff7d7f" stroke-width="8"/>
 <path d="M347 42L332 64M362 42L347 64M377 42L362 64" stroke="#6c0007" stroke-width="6"/>
 <path d="M347 43L333 64M362 43L348 64M377 43L363 64" stroke="#2e080c" stroke-width="2"/>
</g>
<!-- Lower molded lip -->
<path d="M7 642Q13 687 49 688H169Q183 670 201 670H229Q247 670 261 688H384Q419 688 425 650V660Q425 696 385 696H46Q7 696 7 659Z" fill="url(#bottom)"/>
<path d="M14 647Q20 678 49 678H180" fill="none" stroke="#860009" stroke-width="5" stroke-linecap="round"/>
<path d="M17 645Q23 674 50 674H178" fill="none" stroke="#ff646a" stroke-width="2" stroke-linecap="round"/>
<g stroke-linecap="round"><path d="M350 668L339 682M365 668L354 682M380 668L369 682" stroke="#ff757c" stroke-width="7"/><path d="M349 667L338 681M364 667L353 681M379 667L368 681" stroke="#680008" stroke-width="5"/></g>
</svg>