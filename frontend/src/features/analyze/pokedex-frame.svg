<svg xmlns="http://www.w3.org/2000/svg" width="432" height="700" viewBox="0 0 432 700" role="img" aria-label="Classic Red Pokédex frame prototype">
<defs>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2=".22"><stop stop-color="#a4000b"/><stop offset=".055" stop-color="#ff343c"/><stop offset=".13" stop-color="#f20b20"/><stop offset=".5" stop-color="#da0014"/><stop offset=".88" stop-color="#f21323"/><stop offset="1" stop-color="#a5000e"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#ff8b8c"/><stop offset=".13" stop-color="#ff3540"/><stop offset=".42" stop-color="#eb071c"/><stop offset=".85" stop-color="#ce0011"/><stop offset="1" stop-color="#790009"/></linearGradient>
 <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff3b43"/><stop offset=".36" stop-color="#eb071a"/><stop offset=".68" stop-color="#c90010"/><stop offset=".9" stop-color="#f11929"/><stop offset="1" stop-color="#8d000b"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".2" stop-color="#d8e3e9"/><stop offset=".48" stop-color="#6d7781"/><stop offset=".68" stop-color="#ecf1f3"/><stop offset="1" stop-color="#515965"/></linearGradient>
 <radialGradient id="lens" cx=".32" cy=".25" r=".78"><stop stop-color="#bcffff"/><stop offset=".2" stop-color="#17eaff"/><stop offset=".48" stop-color="#00b6f6"/><stop offset=".78" stop-color="#0072da"/><stop offset="1" stop-color="#002c7c"/></radialGradient>
 <radialGradient id="lens-flash" cx=".4" cy=".35" r=".7"><stop stop-color="#fff" stop-opacity="1"/><stop offset=".28" stop-color="#fff" stop-opacity=".95"/><stop offset=".7" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <radialGradient id="green" cx=".35" cy=".25"><stop stop-color="#e6ffb9"/><stop offset=".38" stop-color="#8fff13"/><stop offset=".75" stop-color="#39d100"/><stop offset="1" stop-color="#087000"/></radialGradient>
 <radialGradient id="yellow" cx=".35" cy=".25"><stop stop-color="#fffed5"/><stop offset=".4" stop-color="#ffec1c"/><stop offset=".8" stop-color="#f1c300"/><stop offset="1" stop-color="#ae6500"/></radialGradient>
 <radialGradient id="screen" cx=".48" cy=".4" r=".8"><stop stop-color="#f2fbff"/><stop offset=".7" stop-color="#daf2ff"/><stop offset="1" stop-color="#a7d8ed"/></radialGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Outer molded enclosure -->
<rect x="2" y="2" width="428" height="696" rx="0" fill="#74000a"/>
<rect x="4" y="3" width="424" height="690" rx="0" fill="url(#red)" stroke="#a50011" stroke-width="2"/>
<path d="M15 96V47Q15 13 48 13H384Q418 13 418 47V646Q418 680 385 680H47Q14 680 14 647V145" fill="none" stroke="#ff7c7f" stroke-opacity=".5" stroke-width="2"/>
<path d="M7 90V46Q7 5 49 5H386Q425 5 425 45V87H280L248 115H153L132 128H51Q16 128 7 145Z" fill="url(#top)"/>
