name: Firestore Emulator Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated test dependencies
        working-directory: firebase/testing
        run: npm install --no-audit --no-fund
      - name: Verify bounded private staging deploy target without cloud access
        run: |
          node --test tests/firebase-private-staging.test.mjs
          node scripts/firebase-private-staging.mjs --check
      - name: Validate staging-only Firebase Rules REST publishing safeguards
        run: python3 -m unittest discover -s tests -p 'test_firebase_rules_rest.py'
      - name: Test Git-to-Staging rules promotion and drift guards
        run: python3 -m unittest discover -s tests -p 'test_firebase_rules_ci.py'
      - name: Test keyless staging publisher wiring
        run: |
          python3 -m unittest discover -s tests -p 'test_firebase_rules_ci.py'
          python3 -m unittest discover -s tests -p 'test_firebase_rules_oidc.py'
          bash -n scripts/setup_firebase_rules_oidc.sh
      - name: Verify proposed production OIDC bootstrap stays isolated and inert
        run: |
          python3 -m unittest discover -s tests -p 'test_firebase_rules_oidc_production.py'
          bash -n scripts/setup_firebase_rules_oidc_production.sh
      - name: Verify bootstrap and prototype rules in a demo-only emulator
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-pokefolio-isolation --config firebase/emulator.json "npm --prefix firebase/testing test"
