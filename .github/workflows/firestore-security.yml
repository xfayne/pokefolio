name: Firestore Emulator Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated test dependencies
        working-directory: firebase/testing
        run: npm install --no-audit --no-fund
      - name: Verify bootstrap and prototype rules in a demo-only emulator
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-pokefolio-isolation --config firebase/emulator.json "npm --prefix firebase/testing test"
