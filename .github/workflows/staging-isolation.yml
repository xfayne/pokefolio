name: Staging Isolation Guard
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/staging-isolation.test.mjs tests/import-safety.test.mjs tests/locked-worker.test.mjs tests/firebase-staging.test.mjs ebay-worker/firebase-auth.test.mjs tests/staging-preview.test.mjs
      - run: node scripts/firebase-staging.mjs --check
